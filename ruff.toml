# The lint of the Python of the checkout (make lint-python). The rules and the target match the Python package, so the lint
# of one checkout does not depend on the ruff configuration of the machine (ruff reads a user file only without a project file).
# The generated showcase programs are compiler output that is never edited, and the fixture of the vendored kit tests is
# kit's own input; both are excluded. The code blocks of docs are text of the documents, whose English and Korean twins must
# hold identical code blocks (make documents-check), so the formatter does not rewrite them; the package tests run them.
target-version = "py314"
extend-exclude = ["tools/showcase/adapters/generated", "tests/kit/fixture", "docs"]

[lint]
select = ["E4", "E7", "E9", "F"]
