# The release workflow of template, its own copy of the example of kit (T27.1-64, kit K1052).
#
# The workflow starts by itself when a push run of the CI workflow ci succeeds on main (K987): it checks out the head_sha of that
# run, and release-tag with AUTO releases the top ## X.Y.Z of its change log at that commit (K988, K990), unless that version is
# tagged already: a commit whose top version is tagged on its line ends green with nothing to release. A commit whose ## Unreleased
# is empty releases its top version at once, so a green commit after the version commit releases it. A commit with entries under
# ## Unreleased waits for the CI run of its version commit, whose success releases the version; when no run released it, the run
# fails and names the version commit. A concurrency group of the job runs one release of the repository at a time.
# A dispatch of the workflow with the id of a successful CI run releases the commit of that run (K911): it tags the commit with
# the version of the newest section ## X.Y.Z of its change log (K924) and creates the GitHub Release of the tag as a draft with
# its archives, and makes it public. The run is the evidence; the release runs no test again. The steps run in order and stop at
# the first failure; each job runs its recipe ci-release-<job> of the Makefile in one run step (T28.61), whose lines run these
# targets in order, with TAG, vX.Y.Z, from the outputs of the job tag:
#   bootstrap package installs the locked kit with the npm that devEngines.packageManager names for consumers, without scripts
#   install-tools TOOLS=npm installs the mise, the node and the npm of mise.toml with the copied installer of scripts/kit/bootstrap
#   install-packages installs package-lock.json with that npm, @polyspec/kit included, whose utilities the targets below run
#   release-tag      with the kit of main: requires a completed successful push or dispatch run RUN of ci.yml whose
#                    commit is on origin/main, reads X.Y.Z from the change log of that commit, creates and pushes the annotated
#                    tag vX.Y.Z and the tag of every Go module at that commit, or passes for a tag there already (K269), and
#                    appends TAG and VERSION to GITHUB_ENV; a tag pushed with the token of the run starts no run
#   checkout of the tag, then the bootstrap, npm and the packages of the tagged commit again
#   release-prepare  the preparation that the release of template needs (none)
#   release-tools    installs the tools that config/release.json needs for the packages of this repository; a make entry adds none
#   the later lines of ci-release-release run with var/tools/bin and the shims of mise on PATH, as release-tools-path gives them
#   release-assets  builds the archive of every package, and packages.json of the Composer packages, into var/release/assets
#   release-recipes  writes packages/release.mk, the release recipes of the bindings (binding GN-19h)
#   release-go-module carries the Go module of the tag with the static libraries of the platforms (GN-19f) and pushes its tag
#   release-publish creates the GitHub Release of the tag as a draft, with its notes and those files
#   release-platform-assets uploads the assets of each platform to the draft under their labels (GN-19g)
#   release-undraft makes the release public
# The job tag runs ci-release-tag: release-tag, then release-tag-output gives TAG and VERSION to the later jobs. The job assets
# calls assets.yml with the tag (binding GN-19i): it builds the assets of each platform on the runner of that platform, after the
# release check of binding (make release-binding-check), which fails while a dependency line of polyspec-binding-core or of
# another polyspec crate names a branch or a commit (CK-70). The job release runs ci-release-release on the tree of the tag,
# which adds the assets of the job assets, downloaded into var/release/downloaded, to var/release/assets after release-assets.
# A failed line leaves the release a draft and fails the run. GH_TOKEN, the token of the run, is the one environment of a job.
name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run:
        description: The id of the successful CI run whose exact commit is released
        required: true
        type: string

permissions:
  contents: write
  actions: read

# rustup installs no toolchain on the first cargo, as in every workflow of template (T18.7-1).
env:
  RUSTUP_AUTO_INSTALL: '0'

jobs:
  tag:
    # A workflow_run starts the release for a successful push or dispatch run of CI alone (K987). The concurrency group is the job's,
    # so a run whose job is skipped never replaces the pending release of a version commit.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')) }}
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # actions/checkout v7.0.1: with the whole history and every branch, so origin/main is there for the ancestry check; a
      # workflow_run checks out the head_sha of its CI run, never a later main (K987), and a dispatch checks out main, whose kit
      # runs release-tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
      # The bootstrap of kit (K992): the Node.js of mise.toml, the locked kit package, the npm of var/tools and the packages.
      - uses: ./.github/actions/kit-bootstrap
      # The tag of the commit of the CI run RUN, given to the later jobs through the outputs of this step (ci-release-tag).
      - id: tag
        name: tag the commit of the CI run
        run: make ci-release-tag RUN="${{ inputs.run || github.event.workflow_run.id }}" AUTO="${{ github.event_name == 'workflow_run' && '1' || '' }}"

  assets:
    needs: tag
    if: ${{ needs.tag.outputs.tag != '' }}
    uses: ./.github/workflows/assets.yml
    with:
      ref: ${{ needs.tag.outputs.tag }}
      release: true

  release:
    needs: [tag, assets]
    if: ${{ needs.tag.outputs.tag != '' }}
    concurrency:
      group: release-${{ github.repository }}-publish
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # The release builds the tree of the tag with its own kit and packages, with the whole history for the Go module.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.tag.outputs.tag }}
      # shivammathur/setup-php 2.40.0: the PHP of .php-version for the Composer packages and the extension of the release.
      # template needs PHP (the Composer packages of config/release.json and php of config/toolchain.json), so it declares
      # .php-version. Composer is a tool of mise.toml, which release-tools installs, so setup-php installs no tools (T24.12).
      # The release runs no check of its own: release-tag refuses a commit whose CI run did not pass (K755).
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        if: ${{ hashFiles('.php-version') != '' }}
        with:
          php-version-file: .php-version
          tools: none
          # The proof runs with no debugger or coverage driver, as the checks do.
          coverage: none
      # The bootstrap of kit for the tagged commit, with its own kit and packages (K992).
      - uses: ./.github/actions/kit-bootstrap
      # actions/download-artifact: the assets of each platform that the job assets built, merged into var/release/downloaded,
      # which ci-release-release adds to var/release/assets after release-assets.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: assets-*
          path: var/release/downloaded
          merge-multiple: true
      # The recipe ci-release-release: the check of zip, release-prepare, release-tools, then with the tools on PATH
      # release-assets, the downloaded assets, Rust, the crates and Go, release-recipes, release-go-module with the identity
      # of the actor of the run, release-publish, release-platform-assets and release-undraft.
      - name: release the tag
        run: make ci-release-release TAG=${{ needs.tag.outputs.tag }} VERSION=${{ needs.tag.outputs.version }}
