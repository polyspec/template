# Release: a tag push creates the GitHub Release of the tag (T22.1-4). The maintainer pushes main once every checklist task
# is done and tags the commit of main vX.Y.Z (or packages/template-go/vX.Y.Z for the Go module of that directory) after
# the check run ci-passed of that commit succeeded. In a tag filter * does not match /, so '**/v*' covers the tag of a Go
# module at any depth (T22.1-5). The steps run in order and stop at the first failure: make release-verify requires the
# tagged commit on origin/main with the check run ci-passed concluded success, without running the tests again; make
# release-versions requires the version of the tag in every manifest and its section in CHANGELOG.md; make
# release-assets builds the npm packages and packs the npm tarballs and a zip of each Composer package, named
# <package>-<language>-<version>.<ext> (the Rust crate and the Python package are not released as an archive and are
# consumed by git tag); make release-publish creates the GitHub Release with the section as notes and the archives
# attached, and a Go tag builds and attaches nothing (scripts/kit/release.mjs, config/release.json). TAG reaches the make
# targets through the environment. Each step runs a make target. The runner image and each action are exact releases, as
# in ci.yml. This workflow is not a job of ci.yml, which runs the full suite on every push to main.
name: release

on:
  push:
    tags: ['v*', '**/v*']

permissions:
  contents: write

# rustup installs no toolchain on the first cargo; make install installs it first (T18.7-1).
env:
  RUSTUP_AUTO_INSTALL: '0'

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # The whole history and every branch, so origin/main is there for the ancestry check.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      # The toolchains of the suite: make install installs npm, Go, the npm dependencies, the Rust
      # toolchain, the Composer packages and the crates, as for every job of ci.yml.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: packages/template-go/go.mod
          cache: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          tools: composer:2.10.3
      - run: make install
      - name: verify the tagged commit
        run: make release-verify
      - name: check the versions
        run: make release-versions
      - name: build the assets
        run: make release-assets
      - name: create the release
        run: make release-publish
