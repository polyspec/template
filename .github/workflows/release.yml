# Release: a tag push creates the GitHub Release of the tag (T22.1-4). Every change reaches main through the merge queue
# with the required checks, so every commit of main passed the full suite; the maintainer releases by tagging a commit
# of main vX.Y.Z after a version-bump pull request, or packages/template-go/vX.Y.Z for the Go module of that directory.
# The steps run in order and stop at the first failure: make release-verify requires the tagged commit on origin/main
# with the check runs push-gate and ci-passed concluded success, without running the tests again; make release-versions
# requires the version of the tag in every manifest and its section in CHANGELOG.md; make release-assets builds the npm
# packages and packs every package (npm pack, a zip of each Composer package, cargo package); make release-publish
# creates the GitHub Release with the section as notes and the archives attached, and a Go tag creates it without
# archives (scripts/release.mjs). TAG reaches the make targets through the environment, never as shell text. Each step
# runs a make target. The runner image and each action are exact releases, as in ci.yml. This workflow is not the job
# release of ci.yml, which runs the full suite on every pull request and merge group.
name: release

on:
  push:
    tags: ['v*', '*/v*']

permissions:
  contents: write

# rustup installs no toolchain on the first cargo; make install installs it first (T18.7-1).
env:
  RUSTUP_AUTO_INSTALL: '0'

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # The whole history and every branch, so origin/main is there for the ancestry check.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      # The toolchains of the job release of ci.yml: make install installs npm, Go, the npm dependencies, the Rust
      # toolchain, the Composer packages and the crates that the archives are built from.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: packages/template-go/go.mod
          cache: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          tools: composer:2.10.3
      - run: make install
      - name: verify the tagged commit
        run: make release-verify
      - name: check the versions
        run: make release-versions
      - name: build the assets
        run: make release-assets
      - name: create the release
        run: make release-publish
