# The scheduled dependency review (T18.10). It asks the registries for newer stable releases and advisories of the
# committed locks and fails with one line for each, naming the package, its version, the newer release or the advisory
# and the fix command. It is not a gate of a commit: make check and the CI workflow read only the files of the tree.
name: Dependency review

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

# rustup installs no toolchain on the first cargo (T18.7-1); make dependency-review installs the toolchain first for cargo-audit.
env:
  RUSTUP_AUTO_INSTALL: '0'

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: mise.toml
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version-file: .php-version
          tools: none
      - name: Bootstrap locked kit package
        run: >-
          npm_config_cache="$PWD/var/bootstrap/npm-cache" npm exec --yes --package="$(node -p 'require("./package.json").packageManager.split("+")[0]')" -- npm ci --ignore-scripts --allow-remote=root
        if: ${{ !cancelled() }}
      - run: make install-tools TOOLS=npm
        if: ${{ !cancelled() }}
      - run: make install-packages
        if: ${{ !cancelled() }}
      - run: make dependency-review
        if: ${{ !cancelled() }}
