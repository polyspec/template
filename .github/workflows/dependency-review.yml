# The scheduled dependency review (T18.10). It asks the registries for newer stable releases and advisories of the
# committed locks and fails with one line for each, naming the package, its version, the newer release or the advisory
# and the fix command. It is not a gate of a commit: make check and the CI workflow read only the files of the tree.
name: Dependency review

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

# rustup installs no toolchain on the first cargo (T18.7-1); make dependency-review installs the toolchain first for cargo-audit.
env:
  RUSTUP_AUTO_INSTALL: '0'

jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: packages/template-go/go.mod
          cache: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          tools: composer:2.10.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version
      - run: make dependency-review
        if: ${{ !cancelled() }}
