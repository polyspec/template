  # The check of this workflow that a release requires (T22.1-3). It runs after every other job, also after a
  # failed, skipped or cancelled one (if: always()), and make ci-passed fails unless every job of needs has the result
  # success, so a new job of this workflow is required once it is listed in needs. Its step has no condition of its own:
  # a skipped step would pass the check. make ci-passed is a tool of @polyspec/kit that the node of mise.toml runs, so the
  # job installs the npm, mise and node of the bootstrap and the packages of package-lock.json, and nothing else (kit K171).
  php-ext:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: mise.toml
          cache: npm
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version-file: .php-version
          tools: none
      - name: Bootstrap locked kit package
        run: >-
          npm_config_cache="$PWD/var/bootstrap/npm-cache" npm exec --yes --package="$(node -p 'require("./package.json").packageManager.split("+")[0]')" -- npm ci --ignore-scripts --allow-remote=root
        if: ${{ !cancelled() }}
      - run: make install-tools TOOLS=npm
        if: ${{ !cancelled() }}
      - run: make install-packages
        if: ${{ !cancelled() }}
      - run: make install-tools TOOLS="php composer"
        if: ${{ !cancelled() }}
      - run: make kit-install-php-arginfo
        if: ${{ !cancelled() }}
      - run: make kit-install-symbols EXTRACTORS=php
        if: ${{ !cancelled() }}
      - run: make template-install-php
        if: ${{ !cancelled() }}
      - run: make ci-targets TARGETS="lint-php-ext test-php-ext template-test-ext"
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: report-php-ext
          path: var/report/ci-targets/
          if-no-files-found: error

  # The check of this workflow that a release requires (T22.1-3). It runs after every other job, also after a
  # failed, skipped or cancelled one (if: always()), and make ci-passed fails unless every job of needs has the result
  # success, so a new job of this workflow is required once it is listed in needs. Its step has no condition of its own:
  # a skipped step would pass the check. make ci-passed is a tool of @polyspec/kit that the node of mise.toml runs, so the
  # job installs the npm, mise and node of the bootstrap and the packages of package-lock.json, and nothing else (kit K171).
  ci-passed:
    if: ${{ always() }}
    needs: [scripts, parity-api, parity-ts, parity-go, parity-rust, parity-php, parity-php-ext, parity-python, generated, delimiters, showcase, docs, typescript, browser, python, editor, go, rust, php, php-ext]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: mise.toml
      - name: Bootstrap locked kit package
        run: >-
          npm_config_cache="$PWD/var/bootstrap/npm-cache" npm exec --yes --package="$(node -p 'require("./package.json").packageManager.split("+")[0]')" -- npm ci --ignore-scripts --allow-remote=root
        if: ${{ !cancelled() }}
      - run: make install-tools TOOLS=npm
      - run: make install-packages
      - name: make ci-passed
        run: make ci-passed RESULTS='${{ toJSON(needs) }}'
