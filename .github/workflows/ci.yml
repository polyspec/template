# Continuous integration. Every job runs its tools through Makefile targets (T20.1-8) with
# `make ci-targets TARGETS="..."`, which runs every target to its end also after a failure and writes a report: the log
# of each target, a summary with the first failure lines of each failed target, which is also the job summary, and the
# versions of the toolchains of the job. Every job uploads its report under `!cancelled()` (T20.1-9). Every target of
# CHECK_TARGETS, the full suite of `make check`, runs in exactly one job, and the jobs run no other target
# (T17.1-10). A verifying job runs every step after a failing step (`!cancelled()`). Every job runs on ubuntu-24.04,
# pins its actions by commit and installs with `make install-tools TOOLS=npm`, which installs the npm of the checkout and
# mise into var/tools, and `make install-packages`, which installs package-lock.json with @polyspec/kit. Native workers
# select their locked tools and dependencies; mixed workers use the complete install. setup-php installs no tools,
# because Composer is a tool of mise.toml. The workflow runs on every push to main and every manual run
# (workflow_dispatch): the job ci-passed, the last job, passes only when every other job of this workflow passed
# (T22.1-3), and a release requires its check run on the tagged commit of main; .github/workflows/release.yml
# releases a tag. A newer push to a branch does not cancel the run of an earlier push.
# Builds, downloads and complete jobs report progress and are judged by exit status. Only individual test cases
# have repository-defined timeouts; a job deadline must not cancel a normal operation or successful tests.
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# rustup installs no toolchain on the first cargo; a job that uses Rust installs it first (T18.7-1).
env:
  RUSTUP_AUTO_INSTALL: '0'
  # setup-node and every npm install restore/read the same lock-keyed download cache.
  npm_config_cache: ${{ github.workspace }}/var/bootstrap/npm-cache

jobs:
  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: mise.toml
          cache: npm
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version-file: .php-version
          tools: none
      - name: Bootstrap locked kit package
        run: >-
          npm_config_cache="$PWD/var/bootstrap/npm-cache" npm exec --yes --package="$(node -p 'require("./package.json").packageManager.split("+")[0]')" -- npm ci --ignore-scripts --allow-remote=root
        if: ${{ !cancelled() }}
      - run: make install-tools TOOLS=npm
        if: ${{ !cancelled() }}
      - run: make install-packages
        if: ${{ !cancelled() }}
      - run: make install
        if: ${{ !cancelled() }}
      - run: make template-install-browsers
        if: ${{ !cancelled() }}
      - run: make ci-targets TARGETS="template-test-scripts template-install-check parity-declarations-check function-contract-check function-inventory-check benchmark-check"
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: report-scripts
          path: var/report/ci-targets/
          if-no-files-found: error

