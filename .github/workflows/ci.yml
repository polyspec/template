# Continuous integration. Every job invokes an existing Makefile target or a script of the repository. The release job
# runs the full suite, the targets of CHECK_TARGETS, through the guard of `make check`, which runs every target to its
# end, and uploads its record var/full-run.json. A verifying job runs every step after a failing step (`!cancelled()`)
# and a make with several targets keeps going (`-k`), so one run reports every failure; only the pages job, which
# publishes, stops at its first failure.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# rustup installs no toolchain on the first cargo; a job that uses Rust installs it first (T18.7-1).
env:
  RUSTUP_AUTO_INSTALL: '0'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version-file: packages/template-go/go.mod
          cache: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
      - run: make install
        if: ${{ !cancelled() }}
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium
        if: ${{ !cancelled() }}
      - run: xvfb-run -a make check
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: full-run
          path: var/full-run.json

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
        if: ${{ !cancelled() }}
      - run: make docs-check
        if: ${{ !cancelled() }}
      - run: make rules-check
        if: ${{ !cancelled() }}

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
        if: ${{ !cancelled() }}
      - run: make lint-js
        if: ${{ !cancelled() }}
      - run: make test-ts
        if: ${{ !cancelled() }}
      - run: node tests/runner/conformance.mjs --langs ts
        if: ${{ !cancelled() }}

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
        if: ${{ !cancelled() }}
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium
        if: ${{ !cancelled() }}
      - run: make test-browser
        if: ${{ !cancelled() }}

  editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
        if: ${{ !cancelled() }}
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium
        if: ${{ !cancelled() }}
      - run: make -k editor-boundary-check test-language format-check test-lsp test-codemirror test-vscode
        if: ${{ !cancelled() }}
      # VS Code needs a display; the integration test runs it on a virtual X server.
      - run: xvfb-run -a make test-vscode-integration
        if: ${{ !cancelled() }}

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version-file: packages/template-go/go.mod
          cache: false
      - run: npm ci
        if: ${{ !cancelled() }}
      - run: make test-go
        if: ${{ !cancelled() }}
      - run: make build-ts
        if: ${{ !cancelled() }}
      - run: node tests/runner/conformance.mjs --langs ts,go
        if: ${{ !cancelled() }}

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: rustup toolchain install --no-self-update
        if: ${{ !cancelled() }}
      - run: npm ci
        if: ${{ !cancelled() }}
      - run: make test-rust
        if: ${{ !cancelled() }}
      - run: make build-ts
        if: ${{ !cancelled() }}
      - run: node tests/runner/conformance.mjs --langs ts,rust
        if: ${{ !cancelled() }}

  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.5']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
      - run: rustup toolchain install --no-self-update
        if: ${{ !cancelled() }}
      - run: npm ci
        if: ${{ !cancelled() }}
      - run: make test-php
        if: ${{ !cancelled() }}
      - run: make build-ts
        if: ${{ !cancelled() }}
      - run: node tests/runner/conformance.mjs --langs ts,php
        if: ${{ !cancelled() }}
      - run: make test-ext
        if: ${{ !cancelled() }}

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [release, docs, typescript, browser, editor, go, rust, php]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/configure-pages@v6
      - run: npm ci
      - run: make docs-static-check
        env:
          VITEPRESS_BASE: /${{ github.event.repository.name }}/
      - run: |
          make build-ts
          mkdir -p docs/.vitepress/dist/examples
          cp -R examples/site docs/.vitepress/dist/examples/site
          test -s docs/.vitepress/dist/examples/site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist
      - id: deployment
        uses: actions/deploy-pages@v5
