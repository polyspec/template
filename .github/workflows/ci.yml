# Continuous integration. Every job invokes an existing Makefile target or a script of the repository. The release job
# runs the full suite, the targets of CHECK_TARGETS, through the guard of `make check`, which runs every target to its
# end, and uploads its record var/full-run.json. A verifying job runs every step after a failing step (`!cancelled()`)
# and a make with several targets keeps going (`-k`), so one run reports every failure; only the pages job, which
# publishes, stops at its first failure. Every job runs on ubuntu-24.04, pins its actions by commit and installs with
# `make install`, which installs the npm and Go of the checkout into var/tools with the Go of setup-go (T19.2).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# rustup installs no toolchain on the first cargo; a job that uses Rust installs it first (T18.7-1).
env:
  RUSTUP_AUTO_INSTALL: '0'

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: packages/template-go/go.mod
          cache: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          tools: composer:2.10.3
      - run: make install
        if: ${{ !cancelled() }}
      - run: make install-vscode
        if: ${{ !cancelled() }}
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium
        if: ${{ !cancelled() }}
      - run: xvfb-run -a make check
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: full-run
          path: var/full-run.json

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: packages/template-go/go.mod
          cache: false
      - run: make install
        if: ${{ !cancelled() }}
      - run: make docs-check
        if: ${{ !cancelled() }}
      - run: make rules-check
        if: ${{ !cancelled() }}

  typescript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: packages/template-go/go.mod
          cache: false
      - run: make install
        if: ${{ !cancelled() }}
      - run: make lint-js
        if: ${{ !cancelled() }}
      - run: make test-ts
        if: ${{ !cancelled() }}
      - run: node tests/runner/conformance.mjs --langs ts
        if: ${{ !cancelled() }}

  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: packages/template-go/go.mod
          cache: false
      - run: make install
        if: ${{ !cancelled() }}
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium
        if: ${{ !cancelled() }}
      - run: make test-browser
        if: ${{ !cancelled() }}

  editor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: packages/template-go/go.mod
          cache: false
      - run: make install
        if: ${{ !cancelled() }}
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium
        if: ${{ !cancelled() }}
      - run: make -k editor-boundary-check test-language format-check test-lsp test-codemirror test-vscode
        if: ${{ !cancelled() }}
      - run: make install-vscode
        if: ${{ !cancelled() }}
      # VS Code needs a display; the integration test runs it on a virtual X server.
      - run: xvfb-run -a make test-vscode-integration
        if: ${{ !cancelled() }}

  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: packages/template-go/go.mod
          cache: false
      - run: make install
        if: ${{ !cancelled() }}
      - run: make test-go
        if: ${{ !cancelled() }}
      - run: make build-ts
        if: ${{ !cancelled() }}
      - run: node tests/runner/conformance.mjs --langs ts,go
        if: ${{ !cancelled() }}

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: packages/template-go/go.mod
          cache: false
      - run: make install
        if: ${{ !cancelled() }}
      - run: make test-rust
        if: ${{ !cancelled() }}
      - run: make build-ts
        if: ${{ !cancelled() }}
      - run: node tests/runner/conformance.mjs --langs ts,rust
        if: ${{ !cancelled() }}

  php:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php: ['8.2', '8.5']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: packages/template-go/go.mod
          cache: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:2.10.3
      - run: make install
        if: ${{ !cancelled() }}
      - run: make test-php
        if: ${{ !cancelled() }}
      - run: make build-ts
        if: ${{ !cancelled() }}
      - run: node tests/runner/conformance.mjs --langs ts,php
        if: ${{ !cancelled() }}
      - run: make test-ext
        if: ${{ !cancelled() }}

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [release, docs, typescript, browser, editor, go, rust, php]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: packages/template-go/go.mod
          cache: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: make install
      - run: make docs-static-check
        env:
          VITEPRESS_BASE: /${{ github.event.repository.name }}/
      - run: |
          make build-ts
          mkdir -p docs/.vitepress/dist/examples
          cp -R examples/site docs/.vitepress/dist/examples/site
          test -s docs/.vitepress/dist/examples/site/index.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
