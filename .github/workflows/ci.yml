# Continuous integration. Every job runs its tools through Makefile targets (T20.1-8) with
# `make ci-targets TARGETS="..."`, which runs every target to its end also after a failure and writes a report: the log
# of each target, a summary with the first failure lines of each failed target, which is also the job summary, and the
# versions of the toolchains of the job. Every job uploads its report under `!cancelled()` (T20.1-9). Every target of
# CHECK_TARGETS, the full suite of `make check`, runs in exactly one job, and the jobs run no other target
# (T17.1-10). A verifying job runs every step after a failing step (`!cancelled()`). Every job runs on ubuntu-24.04,
# pins its actions by commit and installs with `make install-tools TOOLS=npm`, which installs the npm of the checkout and
# mise into var/tools, `make install-packages`, which installs package-lock.json with @polyspec/kit, and `make install`,
# which installs the tools of mise.toml at the digests of mise.lock (T19.2, T24.1, T24.12); setup-php installs no tools,
# because Composer is a tool of mise.toml. The workflow runs on every push to main and every manual run
# (workflow_dispatch): the job ci-passed, the last job, passes only when every other job of this workflow passed
# (T22.1-3), and a release requires its check run on the tagged commit of main; .github/workflows/release.yml
# releases a tag. A newer push to a branch does not cancel the run of an earlier push.
# Every job declares timeout-minutes, about twice its longest successful run, so a job that stops making progress
# fails instead of holding the concurrency group and every later run of main behind it (T24.21).
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# rustup installs no toolchain on the first cargo; a job that uses Rust installs it first (T18.7-1).
env:
  RUSTUP_AUTO_INSTALL: '0'

jobs:
  scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: mise.toml
          cache: npm
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version-file: .php-version
          tools: none
      - run: make install-tools TOOLS=npm
        if: ${{ !cancelled() }}
      - run: make install-packages
        if: ${{ !cancelled() }}
      - run: make install
        if: ${{ !cancelled() }}
      - run: make template-install-browsers
        if: ${{ !cancelled() }}
      - run: make ci-targets TARGETS="template-test-scripts template-install-check dependency-audit parity-declarations-check parity-check function-contract-check function-inventory-check benchmark-check lint-go lint-rust template-lint-go-format template-lint-rust-format"
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: report-scripts
          path: var/report/ci-targets/
          if-no-files-found: error

  generated:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: mise.toml
          cache: npm
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version-file: .php-version
          tools: none
      - run: make install-tools TOOLS=npm
        if: ${{ !cancelled() }}
      - run: make install-packages
        if: ${{ !cancelled() }}
      - run: make install
        if: ${{ !cancelled() }}
      - run: make ci-targets TARGETS="conformance-generated-ts conformance-generated-go conformance-generated-rust conformance-generated-php generated-native-check typed-generator-compile-check generated-lint-check"
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: report-generated
          path: var/report/ci-targets/
          if-no-files-found: error

  delimiters:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: mise.toml
          cache: npm
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version-file: .php-version
          tools: none
      - run: make install-tools TOOLS=npm
        if: ${{ !cancelled() }}
      - run: make install-packages
        if: ${{ !cancelled() }}
      - run: make install
        if: ${{ !cancelled() }}
      - run: make ci-targets TARGETS="delimiter-matrix"
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: report-delimiters
          path: var/report/ci-targets/
          if-no-files-found: error

  showcase:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: mise.toml
          cache: npm
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version-file: .php-version
          tools: none
      - run: make install-tools TOOLS=npm
        if: ${{ !cancelled() }}
      - run: make install-packages
        if: ${{ !cancelled() }}
      - run: make install
        if: ${{ !cancelled() }}
      - run: make ci-targets TARGETS="showcase-check contract-check benchmark-smoke lint-php template-lint-php-format lint-python template-lint-showcase-format template-lint-showcase-warnings compiler-interface-check docs-static-check docs-verify-idempotent"
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: report-showcase
          path: var/report/ci-targets/
          if-no-files-found: error

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: mise.toml
          cache: npm
      - run: make install-tools TOOLS=npm
        if: ${{ !cancelled() }}
      - run: make install-packages
        if: ${{ !cancelled() }}
      - run: make install
        if: ${{ !cancelled() }}
      - run: make ci-targets TARGETS="push-gate-commit docs-check rules-check kit-check toolchain-check owner-validate rebuild-check language-check test-markers-check duplication-check commits-check layout-check typecheck template-test-compiler-types"
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: report-docs
          path: var/report/ci-targets/
          if-no-files-found: error

  typescript:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: mise.toml
          cache: npm
      - run: make install-tools TOOLS=npm
        if: ${{ !cancelled() }}
      - run: make install-packages
        if: ${{ !cancelled() }}
      - run: make install
        if: ${{ !cancelled() }}
      - run: make ci-targets TARGETS="lint-ts test-ts conformance-ts"
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: report-typescript
          path: var/report/ci-targets/
          if-no-files-found: error

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: mise.toml
          cache: npm
      - run: make install-tools TOOLS=npm
        if: ${{ !cancelled() }}
      - run: make install-packages
        if: ${{ !cancelled() }}
      - run: make install
        if: ${{ !cancelled() }}
      - run: make template-install-browsers
        if: ${{ !cancelled() }}
      - run: make ci-targets TARGETS="template-test-browser"
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: report-browser
          path: var/report/ci-targets/
          if-no-files-found: error

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: mise.toml
          cache: npm
      - run: make install-tools TOOLS=npm
        if: ${{ !cancelled() }}
      - run: make install-packages
        if: ${{ !cancelled() }}
      - run: make install
        if: ${{ !cancelled() }}
      - run: make ci-targets TARGETS="test-python conformance-python conformance-generated-python"
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: report-python
          path: var/report/ci-targets/
          if-no-files-found: error

  editor:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: mise.toml
          cache: npm
      - run: make install-tools TOOLS=npm
        if: ${{ !cancelled() }}
      - run: make install-packages
        if: ${{ !cancelled() }}
      - run: make install
        if: ${{ !cancelled() }}
      - run: make template-install-browsers
        if: ${{ !cancelled() }}
      - run: make template-install-vscode
        if: ${{ !cancelled() }}
      # VS Code needs a display; the integration test runs it on a virtual X server.
      - run: xvfb-run -a make ci-targets TARGETS="editor-boundary-check template-test-language format-check template-test-lsp template-test-codemirror template-test-vscode template-test-vscode-integration"
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: report-editor
          path: var/report/ci-targets/
          if-no-files-found: error

  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: mise.toml
          cache: npm
      - run: make install-tools TOOLS=npm
        if: ${{ !cancelled() }}
      - run: make install-packages
        if: ${{ !cancelled() }}
      - run: make install
        if: ${{ !cancelled() }}
      - run: make ci-targets TARGETS="test-go conformance-go"
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: report-go
          path: var/report/ci-targets/
          if-no-files-found: error

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: mise.toml
          cache: npm
      - run: make install-tools TOOLS=npm
        if: ${{ !cancelled() }}
      - run: make install-packages
        if: ${{ !cancelled() }}
      - run: make install
        if: ${{ !cancelled() }}
      - run: make ci-targets TARGETS="test-rust conformance-rust"
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: report-rust
          path: var/report/ci-targets/
          if-no-files-found: error

  php:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    # A failure of one PHP version does not cancel the job of the other, so each version reports its own result (T20.1-13).
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: mise.toml
          cache: npm
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          tools: none
      - run: make install-tools TOOLS=npm
        if: ${{ !cancelled() }}
      - run: make install-packages
        if: ${{ !cancelled() }}
      - run: make install
        if: ${{ !cancelled() }}
      - run: make ci-targets TARGETS="test-php lint-php-ext test-php-ext conformance-php template-test-ext"
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: report-php-${{ matrix.php }}
          path: var/report/ci-targets/
          if-no-files-found: error

  # The check of this workflow that a release requires (T22.1-3). It runs after every other job, also after a
  # failed, skipped or cancelled one (if: always()), and make ci-passed fails unless every job of needs has the result
  # success, so a new job of this workflow is required once it is listed in needs. Its step has no condition of its own:
  # a skipped step would pass the check. make ci-passed is a tool of @polyspec/kit that the node of mise.toml runs, so the
  # job installs the npm, mise and node of the bootstrap and the packages of package-lock.json, and nothing else (kit K171).
  ci-passed:
    if: ${{ always() }}
    needs: [scripts, generated, delimiters, showcase, docs, typescript, browser, python, editor, go, rust, php]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: mise.toml
      - run: make install-tools TOOLS=npm
      - run: make install-packages
      - name: make ci-passed
        run: make ci-passed RESULTS='${{ toJSON(needs) }}'
