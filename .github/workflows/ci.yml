# Continuous integration. Every job runs its tools through Makefile targets (T20.1-8). The release job runs the full
# suite, the targets of CHECK_TARGETS, through the guard of `make check`, and every other job runs its targets with
# `make ci-targets TARGETS="..."`; both run every target to its end also after a failure and write a report, the log of
# each target and a summary with the first failure lines of each failed target, which is also the job summary. Every
# job uploads its report under `!cancelled()`, the release job also its record var/full-run.json (T20.1-9). A verifying
# job runs every step after a failing step (`!cancelled()`). Every job runs on ubuntu-24.04, pins its actions by commit
# and installs with `make install`, which installs the npm and Go of the checkout into var/tools with the Go of setup-go
# (T19.2). The workflow runs on every pull request, every merge group of the merge queue and every manual run
# (workflow_dispatch, T17.1-9): the ruleset main of
# .github/ruleset.json requires every job, and the queue moves main to the merge group commit only after they passed on
# it, so the run of the merge group is the evidence of the commit that main receives (T17.1-7). A new push to a pull
# request cancels the run of its previous push; a merge group has a ref of its own, and its run is never cancelled.
name: CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# rustup installs no toolchain on the first cargo; a job that uses Rust installs it first (T18.7-1).
env:
  RUSTUP_AUTO_INSTALL: '0'

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: packages/template-go/go.mod
          cache: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          tools: composer:2.10.3
      - run: make install
        if: ${{ !cancelled() }}
      - run: make install-vscode
        if: ${{ !cancelled() }}
      - run: make install-browsers
        if: ${{ !cancelled() }}
      - run: xvfb-run -a make check
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: report-release
          path: |
            var/full-run.json
            var/report/full-run/
          if-no-files-found: error

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: packages/template-go/go.mod
          cache: false
      - run: make install
        if: ${{ !cancelled() }}
      - run: make ci-targets TARGETS="docs-check rules-check"
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: report-docs
          path: var/report/ci-targets/
          if-no-files-found: error

  typescript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: packages/template-go/go.mod
          cache: false
      - run: make install
        if: ${{ !cancelled() }}
      - run: make ci-targets TARGETS="lint-js test-ts conformance-ts"
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: report-typescript
          path: var/report/ci-targets/
          if-no-files-found: error

  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: packages/template-go/go.mod
          cache: false
      - run: make install
        if: ${{ !cancelled() }}
      - run: make install-browsers
        if: ${{ !cancelled() }}
      - run: make ci-targets TARGETS="test-browser"
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: report-browser
          path: var/report/ci-targets/
          if-no-files-found: error

  editor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: packages/template-go/go.mod
          cache: false
      - run: make install
        if: ${{ !cancelled() }}
      - run: make install-browsers
        if: ${{ !cancelled() }}
      - run: make install-vscode
        if: ${{ !cancelled() }}
      # VS Code needs a display; the integration test runs it on a virtual X server.
      - run: xvfb-run -a make ci-targets TARGETS="editor-boundary-check test-language format-check test-lsp test-codemirror test-vscode test-vscode-integration"
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: report-editor
          path: var/report/ci-targets/
          if-no-files-found: error

  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: packages/template-go/go.mod
          cache: false
      - run: make install
        if: ${{ !cancelled() }}
      - run: make ci-targets TARGETS="test-go conformance-go"
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: report-go
          path: var/report/ci-targets/
          if-no-files-found: error

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: packages/template-go/go.mod
          cache: false
      - run: make install
        if: ${{ !cancelled() }}
      - run: make ci-targets TARGETS="test-rust conformance-rust"
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: report-rust
          path: var/report/ci-targets/
          if-no-files-found: error

  php:
    runs-on: ubuntu-24.04
    # A failure of one PHP version does not cancel the job of the other, so each version reports its own result (T20.1-13).
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: packages/template-go/go.mod
          cache: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:2.10.3
      - run: make install
        if: ${{ !cancelled() }}
      - run: make ci-targets TARGETS="test-php conformance-php test-ext"
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: report-php-${{ matrix.php }}
          path: var/report/ci-targets/
          if-no-files-found: error
