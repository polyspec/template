# The push gate (T17.1-3). Every push to a branch other than those of the merge queue, every pull request and every
# merge group of the merge queue runs the push gate, through make (T20.1-8), on the pushed commit, the head commit of the
# pull request or the merge group commit: `make ci-targets TARGETS="push-gate-commit ..."` runs
# `node scripts/push-gate.mjs commit`, which fails while a task of docs/plans/execution-checklist.md is [~] in that
# commit, naming each task, and when the commit does not track .githooks/pre-push with mode 100755. The pre-push hook
# refuses such a push locally; this job reports a push that did not run the hook. It also runs the document, checklist,
# feature and rule checks (T17.1-5) and the compiler digests of the committed artifacts (T17.1-6), which need Node.js
# alone. The ruleset main of .github/ruleset.json requires this job, so the merge queue merges no commit that fails it
# (T17.1-7). The job installs nothing; like every job that runs make it sets up the Node.js of .node-version and the Go
# of go.mod. It pins every action by its commit, runs on ubuntu-24.04 and uploads its report under !cancelled()
# (T20.1-9). A new push to a pull request cancels the gate of its previous push; no other run is cancelled.
name: Push gate

on:
  push:
    branches-ignore: ['gh-readonly-queue/**']
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# rustup installs no toolchain on the first cargo; this job runs no cargo (T18.7-1).
env:
  RUSTUP_AUTO_INSTALL: '0'

jobs:
  push-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: packages/template-go/go.mod
          cache: false
      - run: make ci-targets TARGETS="push-gate-commit documents-check feature-check rules-check artifact-digest-check"
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: report-push-gate
          path: var/report/ci-targets/
          if-no-files-found: error
