# The assets of each platform of the bindings (binding GN-19a, GN-19i). The workflow ci calls it for the commit of its run, and
# the workflow release calls it for the tree of the tag that it releases, with release true, which runs the release check of
# binding before a job builds (make release-binding-check, GN-19g). Every recipe that builds an asset is in packages/release.mk,
# which binding release-recipes writes and Git ignores, so each job first runs make release-recipes.
#
# The jobs platform and php run on the runner of their platform, ubuntu-26.04, ubuntu-26.04-arm or macos-15, the one exception to the
# runner rule of the workflows of template (tests/scripts/toolchain-files.test.mts): the asset of a platform is linked and
# loaded only on that platform, because no tool of the release compiles for another platform. Each platform job builds the static
# library of the Go module (with the musl library of its arch on Linux), the abi3 wheel and the
# npm platform package of its platform. The php job builds one extension per platform and declared PHP minor; the job npm the
# npm package itself with the wasm-bindgen of mise.toml. Each uploads var/release/assets as an artifact, which the workflow release downloads. Each job runs one
# recipe of the Makefile, make ci-assets-<job> (T28.61), with the values of its matrix and the input release as make variables:
# the recipe installs and writes what the job needs, which stops at a failure, then builds every asset of the job also after
# a failed one, so one run names every asset that does not build.
name: assets

on:
  workflow_call:
    inputs:
      ref:
        description: The tag whose tree the jobs build; empty builds the commit of the calling run
        required: false
        type: string
        default: ''
      release:
        description: Whether each job runs the release check of binding before it builds
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# rustup installs no toolchain on the first cargo; make install-tools TOOLS="rust" installs the toolchain of
# rust-toolchain.toml, with its components llvm-tools and clippy and its targets, and make template-install-rust fetches the
# crates of every Cargo.lock, which binding reads offline (T18.7-1).
env:
  RUSTUP_AUTO_INSTALL: '0'

jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64-gnu
            runner: ubuntu-26.04
          - platform: linux-arm64-gnu
            runner: ubuntu-26.04-arm
          - platform: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      # The whole history, whose commit time release-wheel reads to date the files of the wheel.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
      - name: Bootstrap kit, npm and the packages of package-lock.json (K992)
        uses: ./.github/actions/kit-bootstrap
      # Rust and the crates, the uv and the Python of mise.toml, with which uv builds the wheel, the release recipes, then the
      # static library of the Go module, the wheel and the npm platform package.
      - name: Build the assets of the platform
        run: make ci-assets-platform RELEASE=${{ inputs.release }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: assets-${{ matrix.platform }}
          path: var/release/assets/
          if-no-files-found: error

  php:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64-gnu
            runner: ubuntu-26.04
            php: '8.4'
          - platform: linux-x64-gnu
            runner: ubuntu-26.04
            php: '8.5'
          - platform: linux-arm64-gnu
            runner: ubuntu-26.04-arm
            php: '8.4'
          - platform: linux-arm64-gnu
            runner: ubuntu-26.04-arm
            php: '8.5'
          - platform: darwin-arm64
            runner: macos-15
            php: '8.4'
          - platform: darwin-arm64
            runner: macos-15
            php: '8.5'
    runs-on: ${{ matrix.runner }}
    steps:
      # The whole history, whose commit time release-wheel reads to date the files of the wheel.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
      - name: Bootstrap kit, npm and the packages of package-lock.json (K992)
        uses: ./.github/actions/kit-bootstrap
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          tools: none
          coverage: none
      # KyleMayes/install-llvm-action v2.0.9: the LLVM of config/toolchain.json (llvm.version), whose libclang and clang the
      # bindgen of ext-php-rs reads (binding GN-19i). The ubuntu-26.04 images hold LLVM 20, 21 and 22 at /usr/lib/llvm-<major>;
      # the macos-15 image holds only LLVM 17 and Homebrew llvm@18, so the step installs it there and sets LLVM_PATH, which
      # make ci-assets-php passes as LLVM_ROOT.
      - uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        if: runner.os == 'macOS'
        with:
          version: '21.1.8'
          directory: ${{ runner.temp }}/llvm
      # Rust and the crates and the release recipes, then the extension for the PHP of the setup, whose minor the build checks
      # against EXPECTED_PHP_MINOR.
      - name: Build the PHP extension for its declared minor
        run: make ci-assets-php EXPECTED_PHP_MINOR=${{ matrix.php }} RELEASE=${{ inputs.release }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: assets-php-${{ matrix.platform }}-${{ matrix.php }}
          path: var/release/assets/
          if-no-files-found: error

  npm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
      - name: Bootstrap kit, npm and the packages of package-lock.json (K992)
        uses: ./.github/actions/kit-bootstrap
      # Rust and the crates, the release recipes and the wasm-bindgen of mise.toml, then the npm package.
      - name: Pack the npm package
        run: make ci-assets-npm RELEASE=${{ inputs.release }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: assets-npm
          path: var/release/assets/
          if-no-files-found: error
