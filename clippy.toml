# The clippy configuration of template (R-1). clippy reads clippy.toml from the folder of the Cargo workspace and the
# folders above it.
# P8, R-1: an absence or a failure is never turned into a plausible value. A use that is truly needed says so with
# #[allow(clippy::disallowed_methods, reason = "<rule id>: ...")], which allow_attributes_without_reason requires to carry
# its reason.
disallowed-methods = [
  { path = "core::option::Option::unwrap_or", reason = "R-1: an absence becomes a value; match it or state the rule" },
  { path = "core::option::Option::unwrap_or_default", reason = "R-1: an absence becomes a default value; match it or state the rule" },
  { path = "core::option::Option::unwrap_or_else", reason = "R-1: an absence becomes a computed value; match it or state the rule" },
  { path = "core::option::Option::map_or", reason = "R-1: an absence becomes a value; match it or state the rule" },
  { path = "core::option::Option::map_or_else", reason = "R-1: an absence becomes a computed value; match it or state the rule" },
  { path = "core::result::Result::ok", reason = "P8: an Err becomes None and its error is dropped; match it, use ? or state the need" },
  { path = "core::result::Result::unwrap_or", reason = "P8: an Err becomes a plausible value; handle the error or state the need" },
  { path = "core::result::Result::unwrap_or_default", reason = "P8: an Err becomes a default value; handle the error or state the need" },
  { path = "core::result::Result::unwrap_or_else", reason = "P8: an Err becomes a computed fallback; handle the error or state the need" },
  { path = "core::result::Result::map_or", reason = "R-1: an Err becomes a value; handle the error or state the need" },
  { path = "core::result::Result::map_or_else", reason = "R-1: an Err becomes a computed value; handle the error or state the need" },
]
# A test states its expectation with unwrap and expect: a failure there is the failure of the test.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
