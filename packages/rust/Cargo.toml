[package]
name = "polyspec-template"
version = "0.0.11"
edition = "2024"
rust-version = "1.99.0"
description = "Template language implementation: lexer, parser, renderer, functions and CLI"
license = "MIT"
publish = false

[lib]
name = "polyspec_template"
path = "src/lib.rs"

[[bin]]
name = "template"
path = "src/bin/template.rs"

# The tokens and format results of the conformance cases, one test per case through libtest-mimic.
[[test]]
name = "cases"
path = "tests/cases.rs"
harness = false

# The conformance cases rendered in-process, one test per case through libtest-mimic.
[[test]]
name = "conformance"
path = "tests/conformance.rs"
harness = false

# The expression vectors of tests/fixtures/expr/cases.json, one test per vector through libtest-mimic.
[[test]]
name = "expr_fixtures"
path = "tests/expr_fixtures.rs"
harness = false

[lints]
workspace = true

# The lints of kit (config/cargo.schema.json): no unsafe code, and every allow attribute names its reason.
[workspace]

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
allow_attributes_without_reason = "deny"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
# The validation of a decoded AST against contracts/schema/ast.schema.json (decode_template, AST-10), with the number
# reading of serde_json under arbitrary_precision; no default feature, so no schema is fetched over HTTP or from a file.
jsonschema = { version = "0.58.6", default-features = false, features = ["arbitrary-precision"] }
# The JSON Pointer of a validated value that the AST types cannot hold, such as a span offset beyond usize
# (decode_template).
serde_path_to_error = "0.1.20"

# The volume serial number and file index of an open file, the identity of a file of FsLoader on Windows; the standard
# library offers them only behind the unstable feature windows_by_handle.
[target.'cfg(windows)'.dependencies]
winapi-util = "0.1.11"

[dev-dependencies]
libtest-mimic = "0.8.2"
syn = { version = "3", features = ["full"] }

[profile.release]
debug = false
