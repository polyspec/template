[package]
name = "polyspec-template"
version = "0.0.27"
edition = "2024"
rust-version = "1.99.0"
description = "Template language implementation: lexer, parser, renderer, functions and CLI"
license = "MIT"
publish = false
# The interface contract of the bindings ships in the crate package, so that a library that takes or gives a template_value
# reads it from the package that Cargo resolved (binding design I-1, T-3).
include = ["/src/**", "/Cargo.toml", "/interface.json", "/README.md"]

[features]
# The command line interface (CNF-4): the binary `template` and its argument parser. A library consumer builds no CLI
# dependency, so the feature is off by default and the CLI builds with `--features cli`.
cli = ["dep:clap"]
# Native expression-vector harness only; the release SDK keeps implementation modules private.
__test_support = []
# G-5, X-1: compiles the arming of the fault injection points of `fault`; a generated binding crate turns it on for its
# tests only, and a release build never does (binding design 3.6).
fault-test = ["polyspec-binding-core/fault-test"]

[lib]
name = "polyspec_template"
path = "src/lib.rs"

[[bin]]
name = "template"
path = "src/bin/template.rs"
required-features = ["cli"]

# The tokens and format results of the conformance cases, one test per case through libtest-mimic.
[[test]]
name = "cases"
path = "tests/cases.rs"
harness = false

# The contract cases of contracts/core-cases.json run against the core, one test per case through libtest-mimic.
[[test]]
name = "contract_cases"
path = "tests/contract_cases.rs"
harness = false

# The command line interface runs the binary, which the feature cli builds.
[[test]]
name = "cli"
path = "tests/cli.rs"
required-features = ["cli"]

# The conformance cases rendered in-process, one test per case through libtest-mimic.
[[test]]
name = "conformance"
path = "tests/conformance.rs"
harness = false

# The expression vectors of tests/fixtures/expr/cases.json, one test per vector through libtest-mimic.
[[test]]
name = "expr_fixtures"
path = "tests/expr_fixtures.rs"
harness = false
required-features = ["__test_support"]

# Formatter cases retain native invariant helpers in the non-default harness bridge.
[[test]]
name = "format"
path = "tests/format.rs"
required-features = ["__test_support"]

[lints]
workspace = true

[dependencies]
# The JSON values of assign data, definitions and the environment, the JSON text of `json` and the text of a number
# (VAL-9, VAL-12, FUN-26), the AST JSON (AST-7, AST-10), the artifact manifest (RT-56) and the output of the command
# line: the one JSON reader and writer of polyspec.
polyspec-json = { git = "https://github.com/polyspec/json.git", branch = "v1/rust-core" }
# The kind interface that the generated bindings read from the core error (binding design E-1, I-2 (3)); Cargo.lock pins the
# commit of the binding repository, the source of the generated binding crates too.
polyspec-binding-core = { git = "https://github.com/polyspec/binding.git", branch = "v1/rust-core" }
clap = { version = "4", features = ["derive"], optional = true }

# The volume serial number and file index of an open file, the identity of a file of FsLoader on Windows; the standard
# library offers them only behind the unstable feature windows_by_handle.
[target.'cfg(windows)'.dependencies]
winapi-util = "0.1.11"

[dev-dependencies]
# Only generated code makes a Raised; the tests make one through the feature `construct` to check that it reaches the
# caller unchanged (FUN-46).
# tests/contract_cases.rs arms the fault injection points of the cases that name them, as a generated binding test does.
polyspec-binding-core = { git = "https://github.com/polyspec/binding.git", branch = "v1/rust-core", features = ["construct", "fault-test"] }
libtest-mimic = "0.8.2"
# The JSON of the test fixtures and of the expected results that the tests compare.
serde = { version = "1", features = ["derive"] }
# unbounded_depth: a contract case of data_depth nests a value deeper than the limit of VAL-20, which as a case value is
# deeper than the 128 levels that serde_json reads by default.
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision", "unbounded_depth"] }
syn = { version = "3", features = ["full"] }
