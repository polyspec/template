[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "polyspec-template"
version = "0.0.4"
description = "Templates with document order, typed data and HTML rendering"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
template = "polyspec.template.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"polyspec.template" = ["py.typed"]
