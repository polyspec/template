# Generated by binding from the interface contract; do not edit. Run make bindings to write it again.
[package]
name = "polyspec-template-python"
version = "0.0.27"
edition = "2021"
rust-version = "1.99.0"
license = "MIT"
publish = false
build = "build.rs"

[lib]
name = "_native"
path = "src/lib.rs"
crate-type = ["cdylib"]

[features]
panic-test = []
fault-test = ["polyspec-template/fault-test"]
codec-test = []
thrown-count-test = []

[dependencies]
polyspec-template = { path = "../rust" }
polyspec-binding-core = { git = "https://github.com/polyspec/binding.git", branch = "v1/rust-core", features = ["construct", "lock"] }
polyspec-json = { git = "https://github.com/polyspec/json.git", branch = "v1/rust-core" }
pyo3 = { version = "=0.30.1", features = ["abi3-py314", "extension-module"] }

[lints]
workspace = true
