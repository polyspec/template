[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "polyspec-template"
version = "0.0.6"
description = "Templates with document order, typed data and HTML rendering"
readme = "README.md"
requires-python = ">=3.14"
# decode_template validates the AST JSON against contracts/schema/ast.schema.json (AST-10). pylock.toml, which make
# python-lock writes from this declaration and constraints.txt, pins it and its dependencies.
dependencies = ["jsonschema>=4.26.0"]

[project.scripts]
template = "polyspec.template.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"polyspec.template" = ["py.typed", "ast.schema.json"]
