<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Browser rendering test</title>
</head>
<body>
<pre id="output"></pre>
<script type="module">
import { AstProgram, Engine, MapLoader, parseJson } from '/packages/template-ts/dist/index.mjs';

// The test page reads the case list injected by the test, renders every case with a map loader
// and writes one JSON result per case into #output.
const toPlain = (value) => {
  if (value instanceof Map) return Object.fromEntries([...value].map(([key, item]) => [key, toPlain(item)]));
  if (Array.isArray(value)) return value.map(toPlain);
  return value;
};

window.renderCases = async (cases) => {
  const results = [];
  for (const item of cases) {
    try {
      const engine = new Engine(new AstProgram({ loader: new MapLoader(item.templates), ...(item.delimiters ? { delimiters: item.delimiters } : {}) }));
      // Data, definitions and environment are JSON text read in this order, as the command line programs read them (CNF-4).
      const assign = parseJson(item.data);
      const options = {};
      if (item.define !== undefined) options.define = toPlain(parseJson(item.define));
      if (item.env !== undefined) options.env = toPlain(parseJson(item.env));
      const html = engine.render('input.tpl', assign, options);
      results.push({ id: item.id, html });
    } catch (error) {
      if (error.code && error.template === undefined) {
        results.push({ id: item.id, error: { code: error.code, template: 'input.tpl', line: 0, col: 0 } });
      } else {
        results.push({ id: item.id, error: error.code ? { code: error.code, template: error.template, line: error.line, col: error.col } : String(error) });
      }
    }
  }
  document.getElementById('output').textContent = JSON.stringify(results);
  return results;
};
</script>
</body>
</html>
