[package]
name = "showcase-adapter-rust"
version = "0.0.1"
edition = "2024"
rust-version = "1.99.0"
publish = false

[lints]
workspace = true

# The lints of kit (config/cargo.schema.json): no unsafe code, and every allow attribute names its reason.
[workspace]

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
allow_attributes_without_reason = "deny"

[dependencies]
polyspec-template = { path = "../../../../packages/rust" }
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
sha2 = "0.10"
