[package]
name = "showcase-adapter-rust"
version = "0.0.1"
edition = "2024"
rust-version = "1.99.0"
publish = false

[lints]
workspace = true

# The lints of the workspace, which make lint-rust runs with cargo clippy (T27.1-64, kit K1050): every warning fails, no
# unsafe code (config/cargo.schema.json), and no hidden error (P8): a dropped must_use value, a `let _` of a must_use or
# untyped value, a map_err that ignores its error and an allow attribute without its reason; clippy.toml of the root
# disallows Result::ok and the unwrap_or family.
[workspace]

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
allow_attributes_without_reason = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
map_err_ignore = "deny"

[dependencies]
polyspec-template = { path = "../../../../packages/rust" }
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
sha2 = "0.10"
