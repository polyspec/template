# The folder layout of template (S5, S7, S9), checked by make layout-check: the common rules of config/layout.kit.yml, which
# kit copies, and the map of this repository. The map holds the name of the repository only; each violation of the common
# rules is a task of docs/plans/execution-checklist.md until the layout follows them.
version: 1
extends:
  - layout.kit.yml

rules:
  - extends_template: no-repository-prefix
    id: layout-no-repository-prefix
    vars: { repo: template }

  - extends_template: go-module-path
    id: layout-go-module-path
    vars: { repo: template }

  # S5: the runtime ports of the main spec (ts, go, rust, php, php-ext, python) and five components without ports, each
  # one TypeScript or JavaScript package: the compiler of AST and generated host code (compiler), the language service
  # with the formatter (language), the language server (lsp), the CodeMirror 6 adapter (codemirror) and the VS Code
  # extension (vscode).
  - id: layout-packages
    paths:
      - "packages/*"
      - "!packages/go"
      - "!packages/php"
      - "!packages/php-ext"
      - "!packages/python"
      - "!packages/rust"
      - "!packages/ts"
      - "!packages/js"
      - "!packages/compiler"
      - "!packages/language"
      - "!packages/lsp"
      - "!packages/codemirror"
      - "!packages/vscode"

  # S7: the cross-language runners, data and tool tests of the root tests/: cases (the conformance cases that every
  # implementation runs, CNF), fixtures (the vectors that the native tests of every implementation read, such as the
  # expression, bound-data and host-value vectors, the inputs of the generated checks of every language and the
  # consumer projects of the release archives), runner (the conformance, generated and function-contract runners over
  # every implementation) and scripts (the tool tests of scripts/, the runners, the Makefile and the configuration).
  - id: layout-root-tests
    paths:
      - "tests/*"
      - "!tests/kit"
      - "!tests/cases"
      - "!tests/fixtures"
      - "!tests/runner"
      - "!tests/scripts"
