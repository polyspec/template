# The folder layout of template (S5, S7, S9), checked by make layout-check: the common rules of config/layout.kit.yml, the
# copy of the example of kit that template owns, and the map of this repository. The map holds the name of the repository only; each violation of the common
# rules is a task of docs/plans/execution/checklist.md until the layout follows them.
version: 1
extends:
  - layout.kit.yml

rules:
  - extends_template: no-repository-prefix
    id: layout-no-repository-prefix
    vars: { repo: template }

  - extends_template: go-module-path
    id: layout-go-module-path
    vars: { repo: template }

  # S5: the runtime ports of the main spec (ts, go, rust, php, php-ext, python), five components without ports, each
  # one TypeScript or JavaScript package: the compiler of AST and generated host code (compiler), the language service
  # with the formatter (language), the language server (lsp), the CodeMirror 6 adapter (codemirror) and the VS Code
  # extension (vscode), and the command line packages (cli), whose PHP application is a package of its own (T26.7-53).
  - id: layout-packages
    paths:
      - "packages/*"
      - "!packages/go"
      - "!packages/php"
      - "!packages/php-ext"
      - "!packages/python"
      - "!packages/rust"
      - "!packages/ts"
      - "!packages/js"
      - "!packages/compiler"
      - "!packages/language"
      - "!packages/lsp"
      - "!packages/codemirror"
      - "!packages/vscode"
      - "!packages/cli"

  # vitest.config.ts: the configuration of the root vitest run, which keeps var out of its collection (T26.7-46); vitest
  # reads it from the root of the project.
  - id: layout-root-files
    vars: { root_files: "{vitest.config.ts,.npmrc}" }

  # S7: the cross-language runners, data and tool tests of the root tests/: browser (the comparator that renders the
  # conformance cases in Chromium with the browser build and compares them with the expected files, a Playwright run
  # that no implementation runner runs), cases (the conformance cases that every implementation runs, CNF), fixtures (the vectors that the native tests of every implementation read, such as the
  # expression, bound-data and host-value vectors, the inputs of the generated checks of every language and the
  # consumer projects of the release archives), runner (the conformance, generated and function-contract runners over
  # every implementation) and scripts (the tool tests of scripts/, the runners, the Makefile and the configuration).
  - id: layout-root-tests
    paths:
      - "tests/*"
      - "!tests/kit"
      - "!tests/browser"
      - "!tests/cases"
      - "!tests/fixtures"
      - "!tests/runner"
      - "!tests/scripts"

  # K244 exception: the VS Code integration suite launches the extension of packages/vscode in VS Code. Its runner is the test
  # of that package (make template-test-vscode-integration runs tests/integration/run.mjs in packages/vscode, and
  # tests/scripts/install-vscode.test.mts starts it there), so the suite stays with the package whose extension it tests.
  - id: suites-at-root
    kind: dir_absent
    level: error
    paths: ["packages/**/integration", "packages/**/conformance", "!packages/vscode/tests/integration"]
    message: "K244: an integration or conformance suite lives in tests/integration/<runtime> or tests/conformance/<runtime> of the root"

  # K245 exception: legacy/packages/python/docs/documentation-manifest.json, of role package, names the AGENTS.md and the CHANGELOG.md
  # (with their Korean twins) of the package as its development procedure and its history. Those two files stay with the
  # package until the manifest and K245 agree, and the package is removed (docs/spec/runtime.md#transition).
  - id: management-files-at-root
    kind: file_absent
    level: error
    paths: ["packages/**/AGENTS*.md", "packages/**/CHANGELOG*.md", "packages/**/Makefile", "legacy/packages/**/AGENTS*.md", "legacy/packages/**/CHANGELOG*.md", "legacy/packages/**/Makefile", "!legacy/packages/python/AGENTS*.md", "!legacy/packages/python/CHANGELOG*.md"]
    message: "K245: AGENTS, CHANGELOG and Makefile lie at the root; a package states its rules and changes there"

  # S6 exception of the transition (docs/spec/runtime.md#transition): legacy/ holds the language packages that the
  # generated bindings replace, under their former paths, until each is removed by a change of its own (V-6 (5)).
  - id: layout-root-folders
    paths: ["*", "!packages", "!contracts", "!docs", "!scripts", "!tests", "!examples", "!benchmarks", "!config", "!.github", "!.githooks", "!.kit", "!.mise", "!.claude", "!legacy"]

  # The stub of the legacy PHP extension stays beside its C sources until the package is removed (V-6 (5)).
  - id: php-ext-stub-place
    paths: ["**/*.stub.php", "!packages/php-ext/src/*.stub.php", "!legacy/packages/php-ext/src/*.stub.php"]

  # The manifests of the binding crates are files that binding scaffold writes with lints of their own, which deny unsafe
  # code outside the FFI sites and an allow attribute without its reason; bindings-check compares them with what binding
  # writes (CK-19), so they do not take the lints of the workspace.
  - id: lint-cargo-lints
    paths: ["**/Cargo.toml", "!tests/kit/fixture/**", "!packages/ts/Cargo.toml", "!packages/python/Cargo.toml", "!packages/php-ext/Cargo.toml"]
